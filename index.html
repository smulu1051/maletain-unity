<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maletain Biodata Collector</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Firebase JS SDK v9+ (Modular) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, doc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Your actual Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyBf-8pFNCUXBZCw95Q_U-ZoIRdM-JcBQVA",
      authDomain: "maletain-biodata.firebaseapp.com",
      projectId: "maletain-biodata",
      storageBucket: "maletain-biodata.firebasestorage.app",
      messagingSenderId: "842340864694",
      appId: "1:842340864694:web:ac984b3395465c474e8c17",
      measurementId: "G-EV3Q82RHS6"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Make db available globally for simple script access
    window.db = db;
    window.firestoreTools = { collection, addDoc, getDocs, doc, deleteDoc, onSnapshot };
  </script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen pb-12">

  <!-- TOP HEADER BANNER -->
  <header class="bg-stone-900 text-white shadow-lg py-6 px-4 mb-8">
    <div class="max-w-6xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
      <div class="flex items-center gap-4">
        <!-- ASSOCIATION LOGO (SVG) -->
        <svg class="w-16 h-16 text-cyan-500 flex-shrink-0" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="100" cy="100" r="90" fill="#121212" stroke="#21b2cc" stroke-width="4"/>
          <path d="M100 35 C115 35, 125 45, 125 60 C125 75, 115 85, 100 85 C85 85, 75 75, 75 60 C75 45, 85 35, 100 35 Z" fill="#e59b2a"/>
          <path d="M50 120 C50 95, 70 80, 100 80 C130 80, 150 95, 150 120 V140 H50 Z" fill="#21b2cc"/>
          <text x="100" y="180" font-family="Arial, sans-serif" font-weight="bold" font-size="14" fill="#ffffff" text-anchor="middle">MALETAIN 6 IN 1</text>
        </svg>
        <div>
          <h1 class="text-2xl md:text-3xl font-extrabold tracking-wide text-white">MALETAIN BIODATA COLLECTOR</h1>
          <p class="text-xs md:text-sm text-cyan-400 font-medium">Maletain 6 in 1 Association — Official Registry</p>
        </div>
      </div>
      <!-- CLOUD STATUS BADGE -->
      <div class="flex items-center gap-2 bg-stone-800 px-4 py-2 rounded-full border border-stone-700">
        <span class="relative flex h-3 w-3">
          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
          <span class="relative inline-flex rounded-full h-3 w-3 bg-emerald-500"></span>
        </span>
        <span class="text-xs font-semibold text-gray-200" id="cloudStatus">Cloud Database Sync Active</span>
      </div>
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <main class="max-w-6xl mx-auto px-4 grid grid-cols-1 lg:grid-cols-3 gap-8">

    <!-- FORM SECTION -->
    <section class="lg:col-span-1 bg-white p-6 rounded-xl shadow-md border border-gray-200">
      <h2 class="text-xl font-bold text-gray-900 mb-4 pb-2 border-b border-gray-200 flex items-center gap-2">
        <svg class="w-5 h-5 text-cyan-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
        Member Registration
      </h2>

      <form id="biodataForm" onsubmit="saveMember(event)" class="space-y-4">
        <!-- PROFILE PHOTO UPLOAD -->
        <div>
          <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">Profile Photo</label>
          <div class="flex items-center gap-3">
            <img id="photoPreview" src="https://via.placeholder.com/80?text=Photo" alt="Preview" class="w-16 h-16 rounded-full object-cover border-2 border-cyan-500 shadow-sm">
            <input type="file" id="photoInput" accept="image/*" onchange="previewImage(event)" class="text-xs text-gray-500 file:mr-2 file:py-1.5 file:px-3 file:rounded-md file:border-0 file:text-xs file:font-semibold file:bg-cyan-50 file:text-cyan-700 hover:file:bg-cyan-100">
          </div>
        </div>

        <!-- PERSONAL DETAILS -->
        <div>
          <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">Full Name *</label>
          <input type="text" id="fullName" required class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-cyan-500 focus:outline-none" placeholder="First and Last Name">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">Gender *</label>
            <select id="gender" required class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-cyan-500 focus:outline-none">
              <option value="">Select</option>
              <option value="Male">Male</option>
              <option value="Female">Female</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">Date of Birth</label>
            <input type="date" id="dob" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-cyan-500 focus:outline-none">
          </div>
        </div>

        <!-- TRIBAL LINEAGE -->
        <div class="pt-2 border-t border-gray-100">
          <label class="block text-xs font-semibold text-cyan-800 uppercase mb-1">Clan / Sub-Clan *</label>
          <input type="text" id="clan" required class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-cyan-500 focus:outline-none" placeholder="e.g. Clan Name">
        </div>

        <div>
          <label class="block text-xs font-semibold text-cyan-800 uppercase mb-1">Ancestral Village *</label>
          <input type="text" id="village" required class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-cyan-500 focus:outline-none" placeholder="e.g. Village Name">
        </div>

        <!-- EDUCATION SECTION -->
        <div class="pt-2 border-t border-gray-100">
          <label class="block text-xs font-semibold text-amber-800 uppercase mb-1">Highest Education Level</label>
          <select id="educationLevel" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-cyan-500 focus:outline-none">
            <option value="Primary School">Primary School</option>
            <option value="High School / Secondary">High School / Secondary</option>
            <option value="TVET / Vocational">TVET / Vocational</option>
            <option value="Diploma">Diploma</option>
            <option value="Bachelor's Degree">Bachelor's Degree</option>
            <option value="Master's / Postgraduate">Master's / Postgraduate</option>
            <option value="Doctorate (PhD)">Doctorate (PhD)</option>
            <option value="Customary / Other">Customary / Other</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold text-amber-800 uppercase mb-1">Institution / School Name</label>
          <input type="text" id="institution" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-cyan-500 focus:outline-none" placeholder="Name of school/university">
        </div>

        <button type="submit" class="w-full py-2.5 bg-cyan-600 hover:bg-cyan-700 text-white font-bold rounded-lg shadow-md transition-colors flex items-center justify-center gap-2 text-sm">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"></path></svg>
          Save Record To Cloud
        </button>
      </form>
    </section>

    <!-- DIRECTORY VIEW SECTION -->
    <section class="lg:col-span-2 bg-white p-6 rounded-xl shadow-md border border-gray-200">
      <div class="flex flex-col sm:flex-row items-center justify-between gap-4 mb-6 pb-2 border-b border-gray-200">
        <h2 class="text-xl font-bold text-gray-900 flex items-center gap-2">
          <svg class="w-5 h-5 text-amber-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
          Association Directory
        </h2>
        <input type="text" id="searchInput" oninput="filterRecords()" placeholder="Search by name, clan, village..." class="w-full sm:w-64 px-3 py-1.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-cyan-500 focus:outline-none">
      </div>

      <!-- MEMBER LIST DISPLAY -->
      <div id="memberList" class="grid grid-cols-1 sm:grid-cols-2 gap-4 max-h-[550px] overflow-y-auto pr-1">
        <!-- Records rendered dynamically via JavaScript -->
      </div>
    </section>
  </main>

  <script>
    let photoBase64 = "";

    function previewImage(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          photoBase64 = e.target.result;
          document.getElementById('photoPreview').src = photoBase64;
        };
        reader.readAsDataURL(file);
      }
    }

    async function saveMember(event) {
      event.preventDefault();
      const memberData = {
        fullName: document.getElementById('fullName').value,
        gender: document.getElementById('gender').value,
        dob: document.getElementById('dob').value,
        clan: document.getElementById('clan').value,
        village: document.getElementById('village').value,
        educationLevel: document.getElementById('educationLevel').value,
        institution: document.getElementById('institution').value,
        photo: photoBase64 || "https://via.placeholder.com/80?text=Photo",
        createdAt: new Date().toISOString()
      };

      try {
        if (window.db && window.firestoreTools) {
          const { collection, addDoc } = window.firestoreTools;
          await addDoc(collection(window.db, "maletain_biodata_records"), memberData);
          alert("Member record successfully saved to the cloud database!");
          document.getElementById('biodataForm').reset();
          document.getElementById('photoPreview').src = "https://via.placeholder.com/80?text=Photo";
          photoBase64 = "";
          loadCloudRecords();
        } else {
          alert("Database connection initializing. Please try again in 3 seconds.");
        }
      } catch (e) {
        console.error("Error adding document: ", e);
        alert("Error saving record to database: " + e.message);
      }
    }

    async function loadCloudRecords() {
      const container = document.getElementById('memberList');
      if (!window.db || !window.firestoreTools) return;

      const { collection, getDocs } = window.firestoreTools;
      try {
        const querySnapshot = await getDocs(collection(window.db, "maletain_biodata_records"));
        container.innerHTML = "";
        
        if (querySnapshot.empty) {
          container.innerHTML = `<p class="text-sm text-gray-500 col-span-2 text-center py-8">No member records found. Use the form to submit entries.</p>`;
          return;
        }

        querySnapshot.forEach((doc) => {
          const data = doc.data();
          container.innerHTML += `
            <div class="bg-stone-50 border border-gray-200 p-4 rounded-lg shadow-sm flex items-start gap-3">
              <img src="${data.photo}" class="w-14 h-14 rounded-full object-cover border border-cyan-500">
              <div>
                <h3 class="font-bold text-gray-900 text-sm">${data.fullName}</h3>
                <p class="text-xs text-gray-600"><strong>Clan:</strong> ${data.clan}</p>
                <p class="text-xs text-gray-600"><strong>Village:</strong> ${data.village}</p>
                <span class="inline-block mt-1 text-[10px] px-2 py-0.5 bg-amber-100 text-amber-800 rounded font-semibold">${data.educationLevel}</span>
              </div>
            </div>
          `;
        });
      } catch (err) {
        console.error("Fetch error:", err);
      }
    }

    // Auto load on start
    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(loadCloudRecords, 1500);
    });
  </script>
</body>
</html>
